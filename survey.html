<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RilevApp - Survey</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/piexifjs"></script>

  <style>
    :root {
      --primary: #1f6f43;
      --dark: #14532d;
      --bg: #f4f7f5;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #667085;
      --border: #d0d5dd;
      --danger: #b42318;
      --ok: #027a48;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: var(--primary);
      color: white;
      text-align: center;
      padding: 18px 14px;
    }

    header h1 {
      margin: 0;
      font-size: 1.55rem;
    }

    header p {
      margin: 4px 0 0;
      font-size: 0.95rem;
      opacity: 0.9;
    }

    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 5px 16px rgba(16, 24, 40, 0.06);
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 7px;
    }

    input[type="text"] {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 13px;
      font-size: 1.05rem;
      background: white;
    }

    input[readonly] { background: #f9fafb; }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 1.05rem;
      font-weight: 800;
      color: white;
      background: var(--primary);
      margin-top: 10px;
      cursor: pointer;
    }

    button.secondary { background: #344054; }
    button.danger { background: var(--danger); }
    button:disabled { background: #98a2b3; cursor: not-allowed; }

    button.busy {
      background: #f97316 !important;
      transform: scale(0.99);
      opacity: 0.95;
    }

    button.flash {
      background: #f97316 !important;
      transform: scale(0.99);
    }

    .status {
      padding: 10px 12px;
      border-radius: 13px;
      font-size: 0.95rem;
      margin-top: 10px;
      background: #f2f4f7;
      color: #344054;
    }

    .status.ok { background: #ecfdf3; color: var(--ok); }
    .status.err { background: #fef3f2; color: var(--danger); }

    .gps-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .camera-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 120px;
      background: var(--dark);
      font-size: 1.25rem;
    }

    .camera-icon {
      font-size: 2.4rem;
      line-height: 1;
    }

    #photoInput {
      display: none;
    }

    img.preview {
      width: 100%;
      max-height: 340px;
      object-fit: contain;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #f9fafb;
      margin-top: 12px;
    }

    .muted {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.35;
    }

    .mini {
      font-size: 0.88rem;
      color: var(--muted);
      margin-top: 8px;
    }

    @media (max-width: 520px) {
      main { padding: 10px; }
      .gps-box { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>RilevApp</h1>
    <p>Rilievo GPS + foto</p>
  </header>

  <main>
    <section class="card">
      <label for="codeInput">Codice identificativo</label>
      <input id="codeInput" type="text" autocomplete="off" placeholder="Es. TEST123" />
      <button id="validateBtn">Valida codice</button>
      <button id="changeCodeBtn" class="secondary" style="display:none;">Cambia codice</button>
      <div id="codeStatus" class="status">Inserisci il codice e premi “Valida codice”.</div>
    </section>

    <section class="card">
      <label>Posizione GPS</label>
      <div class="gps-box">
        <input id="latInput" type="text" readonly placeholder="Latitudine" />
        <input id="lonInput" type="text" readonly placeholder="Longitudine" />
      </div>
      <input id="accuracyInput" type="text" readonly placeholder="Accuratezza GPS" style="margin-top:8px;" />
      <button id="gpsBtn" class="secondary">Aggiorna GPS</button>
      <div id="gpsStatus" class="status">Il GPS verrà richiesto automaticamente.</div>
    </section>

    <section class="card">
      <label>Foto</label>
      <button id="cameraBtn" class="camera-button" type="button">
        <span class="camera-icon">📷</span>
        <span>Scatta / scegli foto</span>
      </button>
      <input id="photoInput" type="file" accept="image/*" capture="environment" />
      <img id="preview" class="preview" alt="Anteprima foto" style="display:none;" />
      <div id="photoStatus" class="status">Nessuna foto acquisita.</div>
    </section>

    <section class="card">
      <button id="saveBtn">Invia rilievo</button>
      <button id="syncBtn" class="secondary">Sincronizza coda</button>
      <div id="saveStatus" class="status">Pronto.</div>
      <div id="queueStatus" class="mini">0 rilievi in coda locale.</div>
      <p class="muted">Se manca rete, il rilievo resta salvato sul dispositivo e verrà inviato quando torna la connessione.</p>
      <button id="clearQueueBtn" class="danger">Svuota coda locale</button>
    </section>
  </main>

  <script>
    // =============================
    // SUPABASE
    // =============================
    const SUPABASE_URL = "https://uvkboeiognxsmkufmzgs.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV2a2JvZWlvZ254c21rdWZtemdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NDY0MjMsImV4cCI6MjA5NTAyMjQyM30.XRefx4ztMwKU4O8Q6BS-KHZLuNGrBR-En35f1vLgEW8";

    const TABLE_CODES = "valid_codes";
    const TABLE_POINTS = "survey_points";
    const STORAGE_BUCKET = "survey-photos";

    let supabaseClient = null;

    try {
      if (!window.supabase) throw new Error("Libreria Supabase non caricata");
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (err) {
      console.error("Errore inizializzazione Supabase:", err);
      alert("Errore inizializzazione app: " + err.message);
    }

    let validatedCode = localStorage.getItem("rilevapp_validated_code") || "";
    let currentPosition = null;
    let processedPhoto = null;

    const els = {
      codeInput: document.getElementById("codeInput"),
      validateBtn: document.getElementById("validateBtn"),
      changeCodeBtn: document.getElementById("changeCodeBtn"),
      codeStatus: document.getElementById("codeStatus"),
      latInput: document.getElementById("latInput"),
      lonInput: document.getElementById("lonInput"),
      accuracyInput: document.getElementById("accuracyInput"),
      gpsBtn: document.getElementById("gpsBtn"),
      gpsStatus: document.getElementById("gpsStatus"),
      cameraBtn: document.getElementById("cameraBtn"),
      photoInput: document.getElementById("photoInput"),
      preview: document.getElementById("preview"),
      photoStatus: document.getElementById("photoStatus"),
      saveBtn: document.getElementById("saveBtn"),
      syncBtn: document.getElementById("syncBtn"),
      saveStatus: document.getElementById("saveStatus"),
      queueStatus: document.getElementById("queueStatus"),
      clearQueueBtn: document.getElementById("clearQueueBtn")
    };

    document.addEventListener("DOMContentLoaded", () => {
      if (validatedCode) {
        els.codeInput.value = validatedCode;
        setStatus(els.codeStatus, `Codice già validato: ${validatedCode}`, "ok");
        els.changeCodeBtn.style.display = "block";
      }
      updateQueueStatus();
      requestGps();
    });

    els.validateBtn.addEventListener("click", validateCode);
    els.changeCodeBtn.addEventListener("click", changeCode);
    els.gpsBtn.addEventListener("click", requestGps);
    els.cameraBtn.addEventListener("click", () => {
      // Su iPhone/Safari il selettore foto deve aprirsi subito nel click utente.
      // Il GPS viene aggiornato dopo la scelta/scatto della foto.
      els.photoInput.click();
    });
    els.photoInput.addEventListener("change", handlePhoto);
    els.saveBtn.addEventListener("click", saveSurvey);
    els.syncBtn.addEventListener("click", syncQueue);
    els.clearQueueBtn.addEventListener("click", clearQueue);
    window.addEventListener("online", syncQueue);

    document.querySelectorAll("button").forEach(button => {
      button.addEventListener("click", () => flashButton(button));
    });

    function flashButton(button) {
      if (button.disabled || button.classList.contains("busy")) return;
      button.classList.add("flash");
      setTimeout(() => button.classList.remove("flash"), 850);
    }

    function setButtonBusy(button, text) {
      button.dataset.originalText = button.textContent;
      button.textContent = text;
      button.disabled = true;
      button.classList.add("busy");
    }

    function resetButtonBusy(button, fallbackText) {
      button.disabled = false;
      button.classList.remove("busy");
      button.textContent = button.dataset.originalText || fallbackText;
    }

    async function validateCode() {
      const code = els.codeInput.value.trim();
      if (!code) return setStatus(els.codeStatus, "Inserisci un codice.", "err");

      if (!navigator.onLine) {
        if (code === validatedCode) return setStatus(els.codeStatus, "Codice autorizzato localmente.", "ok");
        return setStatus(els.codeStatus, "Serve connessione per validare un nuovo codice.", "err");
      }

      setStatus(els.codeStatus, "Verifica codice in corso...");

      try {
        const { data, error } = await supabaseClient
          .from(TABLE_CODES)
          .select("code, active")
          .eq("code", code)
          .eq("active", true)
          .maybeSingle();

        if (error) throw error;
        if (!data) return setStatus(els.codeStatus, "Codice non valido o non attivo.", "err");

        validatedCode = code;
        localStorage.setItem("rilevapp_validated_code", code);
        els.changeCodeBtn.style.display = "block";
        setStatus(els.codeStatus, `Codice validato: ${code}`, "ok");
        requestGps();
      } catch (err) {
        console.error(err);
        setStatus(els.codeStatus, `Errore validazione: ${err.message || err}`, "err");
      }
    }

    function changeCode() {
      if (!confirm("Rimuovere il codice salvato?")) return;
      validatedCode = "";
      localStorage.removeItem("rilevapp_validated_code");
      els.codeInput.value = "";
      els.changeCodeBtn.style.display = "none";
      setStatus(els.codeStatus, "Inserisci un nuovo codice.");
    }

    function requestGps() {
      requestGpsPromiseSafe();
    }

    async function requestGpsPromiseSafe() {
      try {
        setStatus(els.gpsStatus, "Richiesta GPS in corso...");
        const pos = await acquireGpsPromise();
        fillGps(pos);
        setStatus(els.gpsStatus, "GPS acquisito.", "ok");
        return pos;
      } catch (err) {
        console.error(err);
        setStatus(els.gpsStatus, `GPS non disponibile: ${err.message || err}`, "err");
        return null;
      }
    }

    function acquireGpsPromise() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) return reject(new Error("geolocalizzazione non supportata"));
        navigator.geolocation.getCurrentPosition(
          pos => {
            currentPosition = {
              lat: pos.coords.latitude,
              lon: pos.coords.longitude,
              accuracy: pos.coords.accuracy,
              timestamp: new Date().toISOString()
            };
            resolve(currentPosition);
          },
          reject,
          { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
        );
      });
    }

    function fillGps(pos) {
      els.latInput.value = pos.lat.toFixed(7);
      els.lonInput.value = pos.lon.toFixed(7);
      els.accuracyInput.value = `Accuratezza: ${Math.round(pos.accuracy)} m`;
    }

    async function handlePhoto(event) {
      const file = event.target.files[0];
      if (!file) return;

      try {
        setStatus(els.photoStatus, "Acquisizione GPS per la foto...");
        const pos = await requestGpsPromiseSafe();

        if (!pos && !currentPosition) {
          return setStatus(els.photoStatus, "Serve il GPS prima di preparare la foto.", "err");
        }

        setStatus(els.photoStatus, "Preparazione foto...");
        const resizedDataUrl = await resizeImageToJpeg(file, 1600, 1200, 0.60);
        const exifDataUrl = addGpsExif(resizedDataUrl, currentPosition.lat, currentPosition.lon);

        processedPhoto = { dataUrl: exifDataUrl };
        els.preview.src = exifDataUrl;
        els.preview.style.display = "block";
        setStatus(els.photoStatus, "Foto pronta con coordinate EXIF.", "ok");
      } catch (err) {
        console.error(err);
        setStatus(els.photoStatus, `Errore foto: ${err.message || err}`, "err");
      }
    }

    function resizeImageToJpeg(file, maxLandscapeW, maxLandscapeH, quality) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const reader = new FileReader();
        reader.onload = e => {
          img.onload = () => {
            let maxW = maxLandscapeW;
            let maxH = maxLandscapeH;
            if (img.height > img.width) {
              maxW = maxLandscapeH;
              maxH = maxLandscapeW;
            }
            let width = img.width;
            let height = img.height;
            const ratio = Math.min(maxW / width, maxH / height, 1);
            width = Math.round(width * ratio);
            height = Math.round(height * ratio);
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function addGpsExif(jpegDataUrl, lat, lon) {
      const gps = {};
      gps[piexif.GPSIFD.GPSLatitudeRef] = lat >= 0 ? "N" : "S";
      gps[piexif.GPSIFD.GPSLatitude] = degToDmsRational(Math.abs(lat));
      gps[piexif.GPSIFD.GPSLongitudeRef] = lon >= 0 ? "E" : "W";
      gps[piexif.GPSIFD.GPSLongitude] = degToDmsRational(Math.abs(lon));
      gps[piexif.GPSIFD.GPSMapDatum] = "WGS-84";
      const exifBytes = piexif.dump({ "0th": {}, Exif: {}, GPS: gps });
      return piexif.insert(exifBytes, jpegDataUrl);
    }

    function degToDmsRational(degFloat) {
      const deg = Math.floor(degFloat);
      const minFloat = (degFloat - deg) * 60;
      const min = Math.floor(minFloat);
      const sec = Math.round((minFloat - min) * 60 * 100);
      return [[deg, 1], [min, 1], [sec, 100]];
    }

    function dataUrlToBlob(dataUrl) {
      const parts = dataUrl.split(",");
      const mime = parts[0].match(/:(.*?);/)[1];
      const binary = atob(parts[1]);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return new Blob([bytes], { type: mime });
    }

    async function saveSurvey() {
      const code = els.codeInput.value.trim();

      if (!validatedCode || code !== validatedCode) {
        return setStatus(els.saveStatus, "Codice non validato.", "err");
      }

      if (!processedPhoto) {
        return setStatus(els.saveStatus, "Manca la foto.", "err");
      }

      setButtonBusy(els.saveBtn, "Invio in corso...");

      try {
        const freshPos = await requestGpsPromiseSafe();
        if (!freshPos && !currentPosition) {
          setStatus(els.saveStatus, "GPS non disponibile.", "err");
          return;
        }

        const createdAt = new Date();
        const safeCode = sanitizeCode(code);
        const filename = makeFilenameFromDate(createdAt);
        const photoPath = `${safeCode}/${filename}`;

        const finalDataUrl = addGpsExif(processedPhoto.dataUrl, currentPosition.lat, currentPosition.lon);

        const item = {
          local_id: makeLocalId(),
          code,
          lat: currentPosition.lat,
          lon: currentPosition.lon,
          accuracy: currentPosition.accuracy,
          gps_timestamp: currentPosition.timestamp,
          created_local_at: createdAt.toISOString(),
          filename,
          photo_path: photoPath,
          photo_data_url: finalDataUrl
        };

        if (!navigator.onLine) {
          enqueue(item);
          resetPhoto();
          setStatus(els.saveStatus, "Rete assente: rilievo salvato in coda.", "ok");
          return;
        }

        setStatus(els.saveStatus, "Invio in corso...");
        await uploadItem(item);
        resetPhoto();
        setStatus(els.saveStatus, "Rilievo inviato correttamente.", "ok");
      } catch (err) {
        console.error(err);

        if (processedPhoto && currentPosition) {
          try {
            const createdAt = new Date();
            const safeCode = sanitizeCode(code);
            const filename = makeFilenameFromDate(createdAt);
            const photoPath = `${safeCode}/${filename}`;

            enqueue({
              local_id: makeLocalId(),
              code,
              lat: currentPosition.lat,
              lon: currentPosition.lon,
              accuracy: currentPosition.accuracy,
              gps_timestamp: currentPosition.timestamp,
              created_local_at: createdAt.toISOString(),
              filename,
              photo_path: photoPath,
              photo_data_url: processedPhoto.dataUrl
            });
          } catch (_) {}
        }

        resetPhoto();
        setStatus(els.saveStatus, `Invio fallito, salvato in coda: ${err.message || err}`, "err");
      } finally {
        resetButtonBusy(els.saveBtn, "Invia rilievo");
      }
    }

    async function uploadItem(item) {
      if (!supabaseClient) throw new Error("Supabase non inizializzato");

      const filename = item.filename || makeFilenameFromDate(new Date(item.created_local_at || Date.now()));
      const safeCode = sanitizeCode(item.code);
      const photoPath = item.photo_path || `${safeCode}/${filename}`;
      const blob = dataUrlToBlob(item.photo_data_url);

      setStatus(els.saveStatus, `Caricamento foto ${filename}...`);

      const { error: uploadError } = await supabaseClient.storage
        .from(STORAGE_BUCKET)
        .upload(photoPath, blob, { contentType: "image/jpeg", upsert: true });

      if (uploadError) throw uploadError;

      const { data: publicData } = supabaseClient.storage
        .from(STORAGE_BUCKET)
        .getPublicUrl(photoPath);

      setStatus(els.saveStatus, "Salvataggio rilievo...");

      const { error: insertError } = await supabaseClient
        .from(TABLE_POINTS)
        .insert({
          code: item.code,
          lat: item.lat,
          lon: item.lon,
          accuracy: item.accuracy,
          gps_timestamp: item.gps_timestamp,
          created_local_at: item.created_local_at,
          filename: filename,
          photo_path: photoPath,
          photo_url: publicData.publicUrl,
          sync_status: "synced"
        });

      if (insertError) throw insertError;
    }

    function sanitizeCode(code) {
      return String(code || "SENZA_CODICE")
        .trim()
        .replace(/[^a-zA-Z0-9_-]/g, "_")
        .replace(/_+/g, "_")
        .replace(/^_+|_+$/g, "") || "SENZA_CODICE";
    }

    function makeFilenameFromDate(date) {
      const d = date instanceof Date ? date : new Date(date);

      const yyyy = String(d.getFullYear());
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      const hh = String(d.getHours()).padStart(2, "0");
      const mi = String(d.getMinutes()).padStart(2, "0");
      const ss = String(d.getSeconds()).padStart(2, "0");
      const ms = String(d.getMilliseconds()).padStart(3, "0");

      return `${yyyy}${mm}${dd}_${hh}${mi}${ss}_${ms}.jpg`;
    }

    function makeLocalId() {
      if (window.crypto && typeof crypto.randomUUID === "function") return crypto.randomUUID();
      return "local_" + Date.now() + "_" + Math.random().toString(36).slice(2);
    }

    function getQueue() {
      return JSON.parse(localStorage.getItem("rilevapp_queue") || "[]");
    }

    function setQueue(queue) {
      localStorage.setItem("rilevapp_queue", JSON.stringify(queue));
      updateQueueStatus();
    }

    function enqueue(item) {
      const queue = getQueue();
      queue.push(item);
      setQueue(queue);
    }

    async function syncQueue() {
      if (!navigator.onLine) return setStatus(els.saveStatus, "Connessione assente.", "err");

      const queue = getQueue();
      if (queue.length === 0) return setStatus(els.saveStatus, "Nessun rilievo in coda.", "ok");

      setButtonBusy(els.syncBtn, "Sincronizzazione...");
      setStatus(els.saveStatus, `Sincronizzazione di ${queue.length} rilievi...`);

      const remaining = [];
      for (const item of queue) {
        try {
          await uploadItem(item);
        } catch (err) {
          console.error(err);
          remaining.push(item);
        }
      }

      setQueue(remaining);
      setStatus(
        els.saveStatus,
        remaining.length ? `${remaining.length} rilievi ancora in coda.` : "Coda sincronizzata.",
        remaining.length ? "err" : "ok"
      );

      resetButtonBusy(els.syncBtn, "Sincronizza coda");
    }

    function clearQueue() {
      if (!confirm("Svuotare la coda locale? I rilievi non inviati saranno persi.")) return;
      setQueue([]);
      setStatus(els.saveStatus, "Coda locale svuotata.");
    }

    function updateQueueStatus() {
      const n = getQueue().length;
      els.queueStatus.textContent = `${n} riliev${n === 1 ? "o" : "i"} in coda locale.`;
    }

    function resetPhoto() {
      processedPhoto = null;
      els.photoInput.value = "";
      els.preview.src = "";
      els.preview.style.display = "none";
      setStatus(els.photoStatus, "Nessuna foto acquisita.");
    }

    function setStatus(el, text, type = "") {
      el.textContent = text;
      el.className = `status ${type}`.trim();
    }
  </script>
</body>
</html>
