<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RilevApp</title>

  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#1f6f43" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="RilevApp" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --green: #1f6f43;
      --green-dark: #14532d;
      --green-soft: #dcfce7;
      --blue: #0ea5e9;
      --blue-soft: #e0f2fe;
      --amber: #f59e0b;
      --amber-soft: #fef3c7;
      --ink: #101828;
      --muted: #667085;
      --card: rgba(255, 255, 255, 0.88);
      --border: rgba(255, 255, 255, 0.65);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 10%, rgba(34,197,94,0.28), transparent 34%),
        radial-gradient(circle at 85% 15%, rgba(14,165,233,0.25), transparent 32%),
        linear-gradient(135deg, #f0fdf4 0%, #f8fafc 50%, #ecfeff 100%);
      padding: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shell {
      width: 100%;
      max-width: 980px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      border-radius: 34px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: 0 24px 70px rgba(16, 24, 40, 0.16);
      backdrop-filter: blur(16px);
      padding: 34px;
    }

    .hero::before {
      content: "";
      position: absolute;
      right: -90px;
      top: -90px;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: rgba(31,111,67,0.14);
    }

    .hero::after {
      content: "";
      position: absolute;
      left: -80px;
      bottom: -110px;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: rgba(14,165,233,0.12);
    }

    .content {
      position: relative;
      z-index: 1;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 34px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .logo {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, var(--green), #22c55e);
      color: white;
      font-size: 1.8rem;
      box-shadow: 0 12px 26px rgba(31, 111, 67, 0.32);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.3rem, 7vw, 4.4rem);
      letter-spacing: -0.08em;
      color: var(--green-dark);
      line-height: 0.95;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 9px 13px;
      background: rgba(255,255,255,0.68);
      border: 1px solid rgba(31,111,67,0.16);
      color: var(--green-dark);
      font-size: 0.92rem;
      font-weight: 750;
      white-space: nowrap;
    }

    .subtitle {
      max-width: 620px;
      margin: 10px 0 30px;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      line-height: 1.45;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }

    .action-card {
      position: relative;
      min-height: 210px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      text-decoration: none;
      color: var(--ink);
      background: rgba(255,255,255,0.78);
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 14px 34px rgba(16,24,40,0.10);
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .action-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 42px rgba(16,24,40,0.16);
      background: white;
    }

    .action-card .icon {
      width: 62px;
      height: 62px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      font-size: 2rem;
      margin-bottom: 18px;
    }

    .survey .icon {
      background: var(--green-soft);
    }

    .map .icon {
      background: var(--blue-soft);
    }

    .help .icon {
      background: var(--amber-soft);
    }

    .android .icon {
      background: #dcfce7;
    }

    .action-card h2 {
      margin: 0 0 8px;
      font-size: 1.45rem;
      letter-spacing: -0.03em;
    }

    .action-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.35;
      font-size: 0.98rem;
    }

    .arrow {
      position: absolute;
      right: 22px;
      bottom: 20px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #101828;
      color: white;
      font-weight: 900;
    }

    .survey .arrow {
      background: var(--green);
    }

    .map .arrow {
      background: var(--blue);
    }

    .help .arrow {
      background: var(--amber);
    }

    .android .arrow {
      background: var(--green-dark);
    }

    .footer {
      position: relative;
      z-index: 1;
      margin-top: 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .dotline {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 5px rgba(34,197,94,0.13);
    }

    @media (max-width: 720px) {
      body {
        padding: 14px;
        align-items: stretch;
      }

      .shell {
        display: flex;
      }

      .hero {
        width: 100%;
        min-height: calc(100vh - 28px);
        padding: 24px;
        border-radius: 28px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .brand-row {
        flex-direction: column;
        align-items: flex-start;
        margin-bottom: 26px;
      }

      .tag {
        white-space: normal;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .action-card {
        min-height: 170px;
      }

      .footer {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="content">
        <div class="brand-row">
          <div class="brand">
            <div class="logo">🌿</div>
            <div>
              <h1>RilevApp</h1>
              <div class="subtitle">Raccolta dati in campo con GPS.</div>
            </div>
          </div>
          <div class="tag">● App per rilievi</div>
        </div>

        <div class="actions">
          <a class="action-card survey" href="survey.html">
            <div>
              <div class="icon">📷</div>
              <h2>Rilievo</h2>
              <p>Acqusizione di foto georeferenziate dal campo</p>
            </div>
            <div class="arrow">→</div>
          </a>

          <a class="action-card map" href="map.html">
            <div>
              <div class="icon">🗺️</div>
              <h2>Mappa</h2>
              <p>Area ad accesso riservato.</p>
            </div>
            <div class="arrow">→</div>
          </a>

          <a class="action-card help" href="help.html">
            <div>
              <div class="icon">❔</div>
              <h2>Guida</h2>
              <p>Istruzioni per l'uso.</p>
            </div>
            <div class="arrow">→</div>
          </a>
          <a class="action-card android" href="downloads/RilevApp.apk" download>
            <div>
              <div class="icon">🤖</div>
              <h2>App Android</h2>
              <p>Scarica il file APK per installare RilevApp su Android.</p>
            </div>
            <div class="arrow">↓</div>
          </a>

        </div>

        <div class="footer">
          <div class="dotline"><span class="dot"></span><span>RilevApp</span></div>
          <div>RilevApp®</div>
        </div>
      </div>
    </section>
  </main>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
          .then(() => console.log("RilevApp service worker registrato"))
          .catch(err => console.error("Errore service worker:", err));
      });
    }
  </script>
</body>
</html>
