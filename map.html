<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RilevApp - Mappa</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f7f5;
    }

    #map {
      width: 100%;
      height: 100%;
      display: none;
    }

    .login-panel {
      position: fixed;
      inset: 0;
      z-index: 3000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f7f5;
      padding: 16px;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      border: 1px solid #d0d5dd;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(16, 24, 40, 0.12);
      text-align: center;
    }

    .login-card h2 {
      margin: 0;
      color: #1f6f43;
      font-size: 1.7rem;
    }

    .login-card p {
      margin: 4px 0 16px;
      color: #667085;
    }

    .login-card input {
      display: block;
      width: 100%;
      padding: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 12px;
      margin-bottom: 10px;
      font-size: 1rem;
    }

    .login-card button,
    .topbar button,
    .download-btn {
      border: none;
      border-radius: 10px;
      padding: 9px 12px;
      background: #1f6f43;
      color: #ffffff;
      font-weight: 800;
      cursor: pointer;
      font-size: 0.92rem;
    }

    .login-card button {
      width: 100%;
      padding: 13px;
      font-size: 1rem;
    }

    .login-status {
      margin-top: 10px;
      color: #b42318;
      font-size: 0.92rem;
      min-height: 1.2em;
    }

    .topbar {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.22);
      padding: 8px;
      display: none;
      align-items: center;
      gap: 8px;
      max-width: calc(100vw - 20px);
      flex-wrap: wrap;
      justify-content: center;
    }

    .topbar strong {
      color: #1f6f43;
    }

    .topbar span {
      font-size: 0.9rem;
      color: #344054;
    }

    .topbar input {
      width: 170px;
      padding: 9px 10px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      font-size: 0.92rem;
    }

    .topbar .secondary {
      background: #344054;
    }

    .point-label {
      background: #ffffff;
      border: 1px solid #000000;
      border-radius: 8px;
      padding: 2px 6px;
      color: #111827;
      font-weight: 800;
      font-size: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }

    .leaflet-tooltip.point-label::before {
      display: none;
    }

    .popup-card {
      width: 230px;
      max-width: 230px;
      overflow: hidden;
    }

    .popup-card h3 {
      margin: 0 0 6px;
      font-size: 1rem;
      color: #1f2937;
    }

    .popup-card p {
      margin: 4px 0;
      font-size: 0.84rem;
      color: #475467;
      line-height: 1.25;
    }

    .popup-card img.photo-preview {
      display: block;
      width: 100%;
      height: 130px;
      max-width: 100%;
      max-height: 130px;
      object-fit: cover;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      background: #f9fafb;
      margin: 8px 0;
    }

    .download-btn {
      display: block;
      width: 100%;
      text-align: center;
      margin-top: 8px;
    }

    .errbox {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1200;
      background: #fef3f2;
      color: #b42318;
      border: 1px solid #fda29b;
      border-radius: 12px;
      padding: 10px 14px;
      display: none;
      max-width: 90%;
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    }

    @media (max-width: 650px) {
      .topbar {
        left: 10px;
        right: 10px;
        transform: none;
      }

      .topbar input {
        width: 140px;
      }
    }
  </style>
</head>
<body>
  <div id="loginPanel" class="login-panel">
    <div class="login-card">
      <h2>RilevApp</h2>
      <p>Accesso mappa riservata</p>
      <input id="emailInput" type="email" placeholder="Email" autocomplete="email" />
      <input id="passwordInput" type="password" placeholder="Password" autocomplete="current-password" />
      <button id="loginBtn" type="button">Accedi</button>
      <div id="loginStatus" class="login-status"></div>
    </div>
  </div>

  <div id="topbar" class="topbar">
    <strong>RilevApp</strong>
    <span id="countLabel">0 punti</span>
    <input id="codeFilterInput" type="text" placeholder="Codice utente" />
    <button id="goCodeBtn" type="button">Vai a</button>
    <button id="showAllBtn" type="button">Tutti</button>
    <button id="refreshBtn" type="button">Aggiorna</button>
    <button id="logoutBtn" type="button" class="secondary">Esci</button>
  </div>

  <div id="map"></div>
  <div id="errbox" class="errbox"></div>

  <script>
    const SUPABASE_URL = "https://uvkboeiognxsmkufmzgs.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV2a2JvZWlvZ254c21rdWZtemdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NDY0MjMsImV4cCI6MjA5NTAyMjQyM30.XRefx4ztMwKU4O8Q6BS-KHZLuNGrBR-En35f1vLgEW8";
    const TABLE_POINTS = "survey_points";
    const STORAGE_BUCKET = "survey-photos";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const map = L.map("map").setView([40.0, 9.0], 7);

    const satellite = L.tileLayer("https://mt0.google.com/vt/lyrs=y&hl=it&x={x}&y={y}&z={z}", {
      maxZoom: 22,
      attribution: "Google Satellite"
    }).addTo(map);

    const osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "© OpenStreetMap"
    });

    L.control.layers({
      "Satellite": satellite,
      "OpenStreetMap": osm
    }).addTo(map);

    const pointsLayer = L.layerGroup().addTo(map);
    let allPoints = [];

    document.getElementById("loginBtn").addEventListener("click", login);
    document.getElementById("logoutBtn").addEventListener("click", logout);
    document.getElementById("refreshBtn").addEventListener("click", () => loadPoints());
    document.getElementById("goCodeBtn").addEventListener("click", goToCode);
    document.getElementById("showAllBtn").addEventListener("click", showAllPoints);
    document.getElementById("passwordInput").addEventListener("keydown", event => {
      if (event.key === "Enter") login();
    });
    document.getElementById("codeFilterInput").addEventListener("keydown", event => {
      if (event.key === "Enter") goToCode();
    });

    document.addEventListener("DOMContentLoaded", checkSession);

    async function checkSession() {
      const { data } = await supabaseClient.auth.getSession();
      if (data.session) {
        showMap();
        await loadPoints();
      } else {
        showLogin();
      }
    }

    async function login() {
      const email = document.getElementById("emailInput").value.trim();
      const password = document.getElementById("passwordInput").value;
      const status = document.getElementById("loginStatus");

      if (!email || !password) {
        status.textContent = "Inserisci email e password.";
        return;
      }

      status.textContent = "Accesso in corso...";
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        status.textContent = "Accesso negato: " + error.message;
        return;
      }

      status.textContent = "";
      showMap();
      await loadPoints();
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      pointsLayer.clearLayers();
      allPoints = [];
      showLogin();
    }

    function showMap() {
      document.getElementById("loginPanel").style.display = "none";
      document.getElementById("topbar").style.display = "flex";
      document.getElementById("map").style.display = "block";
      setTimeout(() => map.invalidateSize(), 100);
    }

    function showLogin() {
      document.getElementById("loginPanel").style.display = "flex";
      document.getElementById("topbar").style.display = "none";
      document.getElementById("map").style.display = "none";
    }

    async function loadPoints() {
      hideError();
      pointsLayer.clearLayers();

      const { data, error } = await supabaseClient
        .from(TABLE_POINTS)
        .select("id, code, lat, lon, accuracy, filename, photo_url, photo_path, created_at")
        .not("lat", "is", null)
        .not("lon", "is", null)
        .order("id", { ascending: true });

      if (error) {
        showError("Errore caricamento punti: " + error.message);
        return;
      }

      allPoints = data || [];
      renderPoints(allPoints, true);
    }

    function renderPoints(points, fit) {
      pointsLayer.clearLayers();
      document.getElementById("countLabel").textContent = `${points.length} punt${points.length === 1 ? "o" : "i"}`;

      const bounds = [];

      points.forEach(point => {
        const lat = Number(point.lat);
        const lon = Number(point.lon);
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;

        const label = point.filename || `${point.id}.jpg`;
        const photoUrl = point.photo_url || getPublicPhotoUrl(label);

        const marker = L.circleMarker([lat, lon], {
          radius: 8,
          color: "#000000",
          weight: 2,
          fillColor: "#7dd3fc",
          fillOpacity: 0.95
        });

        marker.bindTooltip(label, {
          permanent: true,
          direction: "bottom",
          offset: [0, 10],
          className: "point-label"
        });

        marker.bindPopup(buildPopup(point, label, photoUrl), {
          maxWidth: 260,
          minWidth: 240,
          autoPan: true
        });

        marker.addTo(pointsLayer);
        bounds.push([lat, lon]);
      });

      if (fit && bounds.length > 0) {
        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 18 });
      }
    }

    function goToCode() {
      const code = document.getElementById("codeFilterInput").value.trim();
      if (!code) {
        showError("Inserisci un codice identificativo.");
        return;
      }

      const filtered = allPoints.filter(p => String(p.code || "").toLowerCase() === code.toLowerCase());

      if (filtered.length === 0) {
        showError("Nessun punto trovato per il codice: " + code);
        renderPoints([], false);
        return;
      }

      hideError();
      renderPoints(filtered, true);
    }

    function showAllPoints() {
      document.getElementById("codeFilterInput").value = "";
      hideError();
      renderPoints(allPoints, true);
    }

    function buildPopup(point, label, photoUrl) {
      const lat = Number(point.lat).toFixed(7);
      const lon = Number(point.lon).toFixed(7);
      const accuracy = point.accuracy ? `${Math.round(point.accuracy)} m` : "n.d.";
      const created = point.created_at ? new Date(point.created_at).toLocaleString("it-IT") : "n.d.";

      return `
        <div class="popup-card">
          <h3>${escapeHtml(label)}</h3>
          <p><strong>ID:</strong> ${escapeHtml(point.id)}</p>
          <p><strong>Codice:</strong> ${escapeHtml(point.code || "")}</p>
          <p><strong>Coordinate:</strong><br>${lat}, ${lon}</p>
          <p><strong>Accuratezza:</strong> ${accuracy}</p>
          <p><strong>Data:</strong> ${created}</p>
          <img class="photo-preview" src="${escapeHtml(photoUrl)}" alt="Anteprima foto" loading="lazy" />
          <button class="download-btn" type="button" onclick="downloadPhotoFromPopup(this)" data-url="${escapeHtml(photoUrl)}" data-filename="${escapeHtml(label)}">Salva foto</button>
        </div>
      `;
    }

    async function downloadPhotoFromPopup(button) {
      const url = button.getAttribute("data-url");
      const filename = button.getAttribute("data-filename") || "foto.jpg";

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("Download non riuscito");
        const blob = await response.blob();
        const objectUrl = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = objectUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(objectUrl);
      } catch (err) {
        console.error(err);
        alert("Errore durante il salvataggio della foto.");
      }
    }

    function getPublicPhotoUrl(filename) {
      const { data } = supabaseClient.storage.from(STORAGE_BUCKET).getPublicUrl(filename);
      return data.publicUrl;
    }

    function showError(message) {
      const box = document.getElementById("errbox");
      box.textContent = message;
      box.style.display = "block";
      console.error(message);
    }

    function hideError() {
      const box = document.getElementById("errbox");
      box.textContent = "";
      box.style.display = "none";
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
